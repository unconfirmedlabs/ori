name: Publish @unconfirmed/ori SDK

on:
  push:
    branches:
      - main
    paths:
      - "sdk/**"
      - ".github/workflows/publish.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-sdk
  cancel-in-progress: false

jobs:
  publish-sdk:
    name: Verify and publish SDK
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install npm with trusted-publishing support
        run: npm install --global npm@12.0.2

      - name: Set up Bun
        uses: oven-sh/setup-bun@ecf28ddc73e819eb6fa29df6b34ef8921c743461 # v2.1.3
        with:
          bun-version: "1.4.0"

      - name: Install dependencies
        working-directory: sdk
        run: npm ci

      - name: Test
        working-directory: sdk
        run: npm test

      - name: Typecheck
        working-directory: sdk
        run: npm run typecheck

      - name: Build
        working-directory: sdk
        run: npm run build

      - name: Verify package contents
        working-directory: sdk
        run: npm pack --dry-run

      - name: Read package identity
        id: package
        working-directory: sdk
        run: |
          NAME=$(node --print "require('./package.json').name")
          VERSION=$(node --print "require('./package.json').version")
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "spec=$NAME@$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check whether this exact version is published
        id: registry
        env:
          PACKAGE_SPEC: ${{ steps.package.outputs.spec }}
        run: |
          set +e
          RESULT=$(npm view "$PACKAGE_SPEC" version 2>&1)
          STATUS=$?
          set -e

          if [ "$STATUS" -eq 0 ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "$PACKAGE_SPEC already exists; nothing to publish."
            exit 0
          fi

          case "$RESULT" in
            *E404*|*"404 Not Found"*)
              echo "published=false" >> "$GITHUB_OUTPUT"
              echo "$PACKAGE_SPEC is not published yet."
              ;;
            *)
              echo "$RESULT" >&2
              echo "Unable to determine whether $PACKAGE_SPEC is published." >&2
              exit "$STATUS"
              ;;
          esac

      - name: Publish with trusted OIDC
        if: steps.registry.outputs.published == 'false'
        working-directory: sdk
        run: npm publish --access public --provenance
